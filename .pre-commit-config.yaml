repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - fastapi>=0.110
          - pydantic>=2.6
          - typer>=0.12
          - jinja2>=3.1
          - filelock>=3.13
          - types-toml
