site_name: expdeploy
site_description: Modern Python deploy tool for jsPsych v8 experiments
site_url: https://lobennett.github.io/expdeploy/
repo_url: https://github.com/lobennett/expdeploy
repo_name: lobennett/expdeploy
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Experiment manifest: manifest.md
  - Storage adapters: storage.md
  - Container: container.md
  - CLI reference: cli-reference.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

exclude_docs: |
  superpowers/
